<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Interim UI for phase 1. Replaced by the FigUI3 live UI in phases 2–3. -->
  <style>
    body { margin: 0; padding: 12px 16px; font: 11px/16px Inter, system-ui, sans-serif; background: var(--figma-color-bg); color: var(--figma-color-text); }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row label { width: 40px; }
    .row input { flex: 1; }
    .row output { width: 32px; text-align: right; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    #selection { color: var(--figma-color-text-secondary); margin-bottom: 12px; }
    #status { margin-top: 12px; min-height: 32px; }
    #status.error { color: var(--figma-color-text-danger); }
  </style>
</head>
<body>
  <div id="selection">Select a text layer.</div>
  <div class="row"><label for="left">Left</label><input id="left" type="range" min="0" max="15" step="0.5" value="3"><output id="left-value">3°</output></div>
  <div class="row"><label for="right">Right</label><input id="right" type="range" min="0" max="15" step="0.5" value="3"><output id="right-value">3°</output></div>
  <div class="buttons">
    <fig-button id="restore" variant="secondary">Restore</fig-button>
    <fig-button id="shuffle" variant="secondary">Shuffle</fig-button>
    <fig-button id="apply" variant="primary">Apply</fig-button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <!-- UI_SCRIPT -->
</body>
</html>
